name: Build Python package
run-name: Generate Python ${{ inputs.VERSION || '3.12.10' }}
on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Python version to build and upload'
        default: '3.12.10'
        required: true
      PUBLISH_RELEASES:
        description: 'Whether to publish releases'
        required: true
        type: boolean
        default: false
      THREADING_BUILD_MODES:
        description: 'CPython threading build modes'
        required: true
        type: string
        default: 'default,freethreaded'
      PLATFORMS:
        description: 'Platforms for execution in "os" or "os_arch" format (arch is "x64" by default)'
        required: true
        default: 'ubuntu-22.04,ubuntu-22.04_arm64,ubuntu-24.04,ubuntu-24.04_arm64,macos-15-intel_x64,macos-14_arm64,windows-2022_x64,windows-2022_x86,windows-11-arm64'
  pull_request:
    paths-ignore:
      - 'versions-manifest.json'
      - 'LICENSE'
      - '**.md'
    branches:
      - 'main'

env:
  VERSION: ${{ inputs.VERSION || '3.12.10' }}
defaults:
  run:
    shell: pwsh

jobs:
  generate_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
    steps:
      - name: Generate execution matrix
        id: generate-matrix
        run: |
          [String[]]$configurations = "${{ inputs.platforms || 'ubuntu-22.04,ubuntu-22.04_arm64,ubuntu-24.04,ubuntu-24.04_arm64,macos-15-intel,macos-14_arm64,windows-2022_x64,windows-2022_x86,windows-11-arm64' }}".Split(",").Trim()
          [String[]]$buildModes = "${{ inputs.threading_build_modes || 'default' }}".Split(",").Trim()
          $matrix = @()
          
          foreach ($configuration in $configurations) {
            foreach ($buildMode in $buildModes) {
              $parts = $configuration.Split("_")
              $os = $parts[0]
              $arch = if ($parts[1]) {$parts[1]} else {"x64"}
              switch -wildcard ($os) {
                "*ubuntu*" { $platform = $os.Replace("ubuntu","linux"); if ($arch -eq "arm64" ) { $os = "${os}-arm" } }
                "*macos*" { $platform = 'darwin' }
                "*windows*" { $platform = 'win32'; if ($arch -eq "arm64" ) { $os = "${os}-arm" } }
              }

              if ($buildMode -eq "freethreaded") {
                if ([semver]"${{ inputs.VERSION }}" -lt [semver]"3.13.0") {
                  continue;
                }
                $arch += "-freethreaded"
              }

              $matrix += @{
                'platform' = $platform
                'os' = $os
                'arch' = $arch
              }
            }
          }
          echo "matrix=$($matrix | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT

  build_python:
    needs: generate_matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_NAME: python-${{ inputs.VERSION || '3.12.10' }}-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: true
      
      - name: Build Python ${{ env.VERSION }}
        run: |
          ./builders/build-python.ps1 -Version $env:VERSION `
                  -Platform ${{ matrix.platform }} -Architecture ${{ matrix.arch }}
                  
      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error

  test_python:
    needs: [generate_matrix, build_python]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      ARTIFACT_NAME: python-${{ inputs.VERSION || '3.12.10' }}-${{ matrix.platform }}-${{ matrix.arch }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Fully cleanup the toolcache directory before testing
        run: ./helpers/clean-toolcache.ps1 -ToolName "Python"

      - name: Delete macOS /Library/Frameworks/Python.framework
        if: matrix.platform == 'darwin'
        shell: bash
        run: if [ -d /Library/Frameworks/Python.framework ]; then sudo rm -rf /Library/Frameworks/Python.framework; fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}

      - name: Extract files
        run: |
          if ('${{ matrix.platform }}' -eq 'win32') {
            $artifactName = "${{ env.ARTIFACT_NAME }}.zip"
            7z.exe x "$artifactName" -y | Out-Null
          } else {
            $artifactName = "${{ env.ARTIFACT_NAME }}.tar.gz"
            tar -xzf $artifactName
          }
        working-directory: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}

      - name: Apply build artifact to the local machine
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if ('${{ matrix.platform }}' -eq 'win32') {
            powershell ./setup.ps1
          } else {
            sh ./setup.sh
            cp ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}/build_output.txt ${{ runner.temp }}
          }
        working-directory: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}

      - name: Setup Python ${{ env.VERSION }}
        if: >
          !(runner.os == 'Windows' &&
            matrix.arch == 'arm64' &&
            startsWith(env.VERSION, '3.12'))
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Use built Python artifact for Win ARM64 3.12.x
        if: runner.os == 'Windows' && matrix.arch == 'arm64' && startsWith(env.VERSION, '3.12')
        run: |
          $pythonPath = "${{ runner.temp }}\${{ env.ARTIFACT_NAME }}\python.exe"
          echo "Adding $pythonPath to PATH"
          echo "$pythonPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Python version
        run: python -VVV

      - name: Verbose sysconfig dump
        if: runner.os != 'Windows'
        run: python ./sources/python-config-output.py
        working-directory: ${{ github.workspace }}/tests

      - name: Verbose python binary links
        if: runner.os != 'Windows'
        run: |
          $pythonLocation = which python
          if ('${{ matrix.platform }}' -eq 'darwin') { otool -L $pythonLocation } else { ldd $pythonLocation }

      - name: Run tests
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester
          $pesterContainer = New-PesterContainer -Path './python-tests.ps1' -Data @{
              Version="${{
